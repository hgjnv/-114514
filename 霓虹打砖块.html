];

const LEVELS = [
  { name: '热身', rows: ['nnnnnnnnnn', 'nnnnnnnnnn', 'nnnnggnnnn', 'nnnnnnnnnn'] },
  { name: '双层', rows: ['nnnnnnnnnn', 'n22222222n', 'nn222222nn', 'nnn2222nnn', 'nnnnnnnnnn'] },
  { name: '金字塔', rows: ['....nn....', '...n22n...', '..n2xx2n..', '.n222222n.', 'n22x22x22n', 'nnnnnnnnnn'] },
  { name: '钢铁走廊', rows: ['s........s', 's.nnnnnn.s', 's.n2gg2n.s', 's.nnnnnn.s', 's...22...s', 's........s'] },

  { name: '滑行', rows: ['nnnnnnnnnn', '..........', 'm...m...m.', '..........', '.22222222.', '.3......3.'] },
  { name: '幽灵', rows: ['hhhhhhhhhh', 'n22n22n22n', 'hhhhhhhhhh', '.2xx..xx2.', '..........', '3.3.3.3.3.'] },

/* ================= 状态 ================= */
const S = { sound: true, mode: 'campaign', mods: { fog: false, fast: false, mini: false, solo: false } };
let BEST = {};
try { BEST = JSON.parse(localStorage.getItem('neon-brick-best') || '{}') || {}; } catch (e) { BEST = {}; }
function saveBest() { try { localStorage.setItem('neon-brick-best', JSON.stringify(BEST)); } catch (e) { /* 忽略 */ } }

let G = null;
let state = 'menu'; // menu ready play paused clear over

cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

/* ================= 声音 ================= */
let AC = null, NB = null, lastSnd = 0;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* 忽略 */ } }
  return AC;
}
function tone(f, d, type, v, slide) {
  if (!S.sound || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v || 0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v) {
  if (!S.sound || !AC) return;
  if (!NB) {
    NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const ch = NB.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = NB;
  g.gain.setValueAtTime(v || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(g); g.connect(AC.destination);
  s.start(t); s.stop(t + d + 0.02);
}
function sfx(n) {
  if (!S.sound || !AC || (G && G.demo)) return;
  const now = AC.currentTime;
  if (n !== 'boom' && n !== 'win' && now - lastSnd < 0.03) return;
  lastSnd = now;
  const cb = G ? Math.min(G.combo, 20) : 0;
  switch (n) {
    case 'paddle': tone(220, 0.07, 'triangle', 0.08); break;
    case 'hit': tone(380 + cb * 18, 0.06, 'square', 0.035); break;
    case 'break': tone(520 + cb * 22, 0.09, 'square', 0.04, 1.5); break;
    case 'clank': tone(140, 0.08, 'sawtooth', 0.04); break;
    case 'boom': noise(0.35, 0.16); tone(90, 0.3, 'sawtooth', 0.06, 0.4); break;
    case 'laser': tone(1100, 0.08, 'sawtooth', 0.025, 0.4); break;
    case 'zap': tone(1500, 0.2, 'sawtooth', 0.04, 0.2); break;
    case 'power': tone(520, 0.08, 'triangle', 0.07); setTimeout(() => tone(780, 0.1, 'triangle', 0.07), 70); break;
    case 'bad': tone(220, 0.25, 'sawtooth', 0.06, 0.5); break;
    case 'lose': tone(300, 0.5, 'sawtooth', 0.07, 0.25); break;
    case 'launch': tone(330, 0.08, 'triangle', 0.06, 1.8); break;
    case 'bosshit': tone(110, 0.09, 'square', 0.05); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.07), i * 120)); break;
    default: break;
  }

/* ================= 关卡生成 ================= */
function pickType(d) {
  const t = [['n', 46], ['2', 16 + 10 * d], ['3', 4 + 14 * d], ['x', 4], ['g', 3], ['m', 3 + 4 * d], ['r', 3 + 4 * d], ['h', 3 + 3 * d], ['l', 2 + 2 * d], ['s', d > 0.3 ? 4 + 5 * d : 0], ['.', 10]];
  let tot = 0;
  for (const e of t) tot += e[1];
  let r = Math.random() * tot;
  for (const e of t) { r -= e[1]; if (r <= 0) return e[0]; }
  return 'n';
}
function genRow(d) {
  const half = [];
  for (let c = 0; c < COLS / 2; c++) half.push(pickType(d));
  return half.concat(half.slice().reverse()).join('');
}
const HPMAP = { n: 1, '2': 2, '3': 3, s: 99, x: 1, g: 2, m: 1, r: 2, h: 1, l: 1 };
function mkBrick(c, r, t, rid) {

function mkBoss(k) {
  const hp = 28 + k * 12;
  return { x: W / 2, y: 100, w: 130, h: 54, hp, max: hp, t: 0, shoot: 2.2, k, dead: false, deadT: 0, flash: 0, dropAt: hp - 7, col: ROWCOL[(k + 1) % 6] };
}

function makeGame(mode, demo) {
  const base = S.mods.mini ? 64 : 92;
  return {
    mode, demo: !!demo, level: 1, stage: 1, score: 0, combo: 0, maxCombo: 0, energy: 0,
    lives: mode === 'time' ? 99 : (S.mods.solo ? 1 : 3),
    fx: {}, shield: false, balls: [], bricks: [], pups: [], lasers: [], bullets: [], parts: [], texts: [], rings: [], bolts: [],
    boss: null, waves: [], skillCd: 0, shake: 0, time: 0, timeLeft: 90, spawnT: 9, rowId: 0, laserCd: 0, invuln: 0, banner: null, slowing: false,
    paddle: { x: W / 2, y: H - 44, w: base, tw: base, h: 14, vx: 0 }, target: W / 2, title: '',
  };
}

function spawnBalls() {
  const p = G.paddle;
  G.balls = [];
  if (G.demo) {
    G.balls.push(mkBall(p.x, p.y - 14, 0.4, -1), mkBall(p.x, p.y - 14, -0.4, -1));
    return;
  }
  const offs = G.mode === 'chaos' ? [-24, 0, 24] : [0];
  for (const o of offs) {
    const b = mkBall(p.x + o, p.y - 8, 0, -1);
    b.stuck = true; b.off = o;
    G.balls.push(b);
  }
}

function loadLevel(n, keepBalls) {
  G.level = n; G.bricks = []; G.boss = null; G.pups = []; G.lasers = []; G.bullets = []; G.rings = []; G.bolts = []; G.waves = [];
  let rows = [], boss = 0;
  const mode = G.mode;
  if (mode === 'campaign') {
    const L = LEVELS[n - 1];
    rows = L.rows; G.title = L.name;
    if (L.boss) boss = Math.floor(n / 5);
    G.banner = { t: 2.2, text: '第 ' + n + ' 关 · ' + L.name };
  } else if (mode === 'boss') {
    rows = ['..........', '..........', '..........', genRow(0.2), genRow(0.2)];
    boss = n;
    G.banner = { t: 2.2, text: 'BOSS ' + n + ' 来袭' };
  } else if (mode === 'endless') {
    for (let i = 0; i < 5; i++) rows.push(genRow(0.1 + i * 0.03));
    G.spawnT = 9;
    G.banner = { t: 2, text: '守住防线' };
  } else {
    const d = Math.min(1, n / 10);
    const cnt = clamp(4 + Math.floor(n / 2) + (mode === 'chaos' ? 1 : 0), 4, 9);
    for (let i = 0; i < cnt; i++) rows.push(genRow(d));
    G.banner = { t: 1.6, text: mode === 'time' ? '新一波 +4 秒' : '第 ' + n + ' 关' };
    if (mode === 'time' && n === 1) G.banner.text = '90 秒，开始';
  }
  rows.forEach((s, r) => {
    for (let c = 0; c < COLS; c++) {
      const ch = s[c];
      if (ch && ch !== '.') G.bricks.push(mkBrick(c, r, ch, r));
    }
  });
  G.rowId = rows.length;
  if (boss) G.boss = mkBoss(boss);
  if (!keepBalls) spawnBalls();
}

/* ================= 工具 ================= */
function addScore(base, raw) {
  let m = 1;
  if (!raw) {
    m += Math.min(Math.floor(G.combo / 4) * 0.25, 3);
    if (G.fx.dbl > 0) m *= 2;
  }
  if (S.mods.mini) m *= 1.5;
  if (S.mods.solo) m *= 2;
  const v = Math.round(base * m);
  if (!G.demo) G.score += v;
  return v;
}
function addText(x, y, s, col, size) { G.texts.push({ x, y, s, col: col || C.text, size: size || 14, life: 0.9, max: 0.9 }); }
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) {
    if (G.parts.length > 420) break;
    const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.9);
    const life = 0.4 + Math.random() * 0.5;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col, s: 2 + Math.random() * 3 });
  }
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function circleRect(b, rx, ry, rw, rh) {
  const cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
  const dx = b.x - cx, dy = b.y - cy;
  return dx * dx + dy * dy <= b.r * b.r ? { dx, dy, cx, cy } : null;
}
function bounceOff(b, r, res) {
  const { dx, dy } = res;
  if (dx === 0 && dy === 0) {
    const l = b.x - r.x, rr = r.x + r.w - b.x, t = b.y - r.y, bt = r.y + r.h - b.y;
    const m = Math.min(l, rr, t, bt);
    if (m === l) { b.x = r.x - b.r; b.dx = -Math.abs(b.dx); }
    else if (m === rr) { b.x = r.x + r.w + b.r; b.dx = Math.abs(b.dx); }
    else if (m === t) { b.y = r.y - b.r; b.dy = -Math.abs(b.dy); }
    else { b.y = r.y + r.h + b.r; b.dy = Math.abs(b.dy); }
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) {
    b.dx = dx > 0 ? Math.abs(b.dx) : -Math.abs(b.dx);
    b.x = res.cx + (dx > 0 ? 1 : -1) * b.r;
  } else {
    b.dy = dy > 0 ? Math.abs(b.dy) : -Math.abs(b.dy);
    b.y = res.cy + (dy > 0 ? 1 : -1) * b.r;
  }
}
function fixDir(b) {
  if (Math.abs(b.dy) < 0.2) b.dy = (b.dy < 0 ? -1 : 1) * 0.2;
  if (Math.abs(b.dx) < 0.06) b.dx = (b.dx < 0 ? -1 : 1) * 0.06;
  const l = Math.hypot(b.dx, b.dy);
  b.dx /= l; b.dy /= l;
}
function brickColor(br) {
  switch (br.t) {
    case 'n': return ROWCOL[br.row % 6];
    case '2': case '3': return HPCOL[br.hp] || HPCOL[1];
    case 's': return '#6d6b8f';
    case 'x': return '#ff4d4d';
    case 'g': return br.hp > 1 ? '#ffc857' : '#ffe29a';
    case 'm': return '#ff7ad9';
    case 'r': return br.hp > 1 ? '#3ddc97' : '#9af0c8';
    case 'h': return '#e8e4ff';
    case 'l': return '#ffe45e';
    default: return '#ffffff';
  }
}

/* ================= 砖块、道具、Boss ================= */
function damageBrick(br, dmg, src) {
  if (br.dead) return;
  if (br.t === 's' && src !== 'fire') { br.flash = 0.12; sfx('clank'); return; }
  br.hp -= dmg; br.flash = 0.12; br.rt = 4;
  if (br.hp <= 0) killBrick(br, src);
  else { sfx('hit'); addScore(10); }
}
function killBrick(br, src) {
  br.dead = true;
  const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
  const base = { n: 50, '2': 80, '3': 120, s: 200, x: 100, g: 300, m: 100, r: 100, h: 120, l: 150 }[br.t] || 50;
  const v = addScore(base);
  if (base >= 100) addText(cx, cy, '+' + v, C.gold, 13);
  burst(cx, cy, brickColor(br), 9, 150);
  G.energy = Math.min(100, G.energy + 2.2);
  sfx('break');
  let ch = G.mode === 'chaos' ? 0.4 : 0.12;
  if (br.t === 'g') ch = 1;
  else if (br.t === 'm' || br.t === 'h') ch = Math.max(ch, 0.2);
  else if (br.t === 's') ch = 0.3;
  if (Math.random() < ch) dropPowerup(cx, cy);
  if (br.t === 'x') explodeAt(cx, cy, 74, br);
  if (br.t === 'l') lightning(br);
}
function explodeAt(x, y, r, from) {
  G.rings.push({ x, y, r: 0, max: r, t: 0, life: 0.35, col: '#ffb347' });
  burst(x, y, '#ffb347', 14, 200);
  G.shake = Math.max(G.shake, 6);
  sfx('boom');
  for (const o of G.bricks) {
    if (o.dead || o === from || o.t === 's') continue;
    if (Math.hypot(o.x + o.w / 2 - x, o.y + o.h / 2 - y) < r) damageBrick(o, 1, 'boom');
  }
  if (G.boss && !G.boss.dead && Math.hypot(G.boss.x - x, G.boss.y - y) < r + 40) damageBoss(2);
}
function lightning(br) {
  G.bolts.push({ y: br.y + br.h / 2, t: 0, life: 0.3 });
  sfx('zap');
  for (const o of G.bricks) {
    if (o.dead || o.t === 's' || o === br) continue;
    if (Math.abs(o.y - br.y) < 4) damageBrick(o, 99, 'bolt');
  }
}
function pickPow() {
  let tot = 0;
  for (const t of POWTABLE) tot += t[1];
  let r = Math.random() * tot;
  for (const t of POWTABLE) { r -= t[1]; if (r <= 0) return t[0]; }
  return 'M';
}
function dropPowerup(x, y, key) {
  if (G.pups.length >= 12) return;
  G.pups.push({ x, y, vy: 110, k: key || pickPow(), ph: 0, dead: false });
}
function applyPowerup(k) {
  const P = POW[k], p = G.paddle;
  if (!G.demo) { sfx(P.bad ? 'bad' : 'power'); addText(p.x, p.y - 28, P.n, P.bad ? '#ff8a8a' : P.c, 16); }
  addScore(P.bad ? 0 : 30, true);
  if (k === 'M') multiBall();
  else if (k === 'G') G.shield = true;
  else if (k === 'H') G.lives = Math.min(9, G.lives + 1);
  else {
    if (k === 'W') G.fx.narrow = 0;
    if (k === 'N') G.fx.wide = 0;
    if (k === 'T') G.fx.fast = 0;
    if (k === 'Z') G.fx.slow = 0;
    G.fx[P.fx] = P.dur;
  }
}
function multiBall() {
  let src = G.balls.filter(b => !b.stuck);
  if (!src.length) src = G.balls.slice();
  for (const b of src) {
    for (const ang of [-0.45, 0.45]) {
      if (G.balls.length >= 40) return;
      const c = Math.cos(ang), s = Math.sin(ang);
      let dx = b.dx * c - b.dy * s, dy = b.dx * s + b.dy * c;
      if (b.stuck) { dx = ang * 1.2; dy = -1; }
      G.balls.push(mkBall(b.x, b.y, dx, dy));
    }
  }
}
function damageBoss(d) {
  const B = G.boss;
  if (!B || B.dead) return;
  B.hp -= d; B.flash = 0.1;
  addScore(15);
  G.energy = Math.min(100, G.energy + 1);
  sfx('bosshit');
  if (B.hp <= B.dropAt) { B.dropAt -= 7; dropPowerup(B.x + rnd(-40, 40), B.y + 30); }
  if (B.hp <= 0) killBoss();
}
function killBoss() {
  const B = G.boss;
  B.dead = true; B.deadT = 1.6; G.bullets = [];
  addScore(2000 + B.k * 500, true);
  for (let i = 0; i < 8; i++) burst(B.x + rnd(-55, 55), B.y + rnd(-20, 20), ROWCOL[i % 6], 22, 260);
  G.rings.push({ x: B.x, y: B.y, r: 0, max: 160, t: 0, life: 0.6, col: '#fff' });
  G.shake = 14; sfx('boom');
  for (let i = 0; i < 3; i++) dropPowerup(B.x + rnd(-50, 50), B.y + 20);
  for (const br of G.bricks) if (!br.dead) { br.dead = true; burst(br.x + br.w / 2, br.y + br.h / 2, brickColor(br), 6, 140); }
  addText(B.x, B.y, 'Boss 击破', C.gold, 24);
}
function bossRect() { const B = G.boss; return { x: B.x - B.w / 2, y: B.y - B.h / 2, w: B.w, h: B.h }; }
function bossShoot() {
  const B = G.boss, p = G.paddle;
  const r = B.hp / B.max, bx = B.x, by = B.y + B.h / 2;
  const sp = 170 + (1 - r) * 50;
  const base = Math.atan2(p.x - bx, p.y - by);
  const aim = a => G.bullets.push({ x: bx, y: by, vx: Math.sin(a) * sp, vy: Math.cos(a) * sp, r: 6 });
  if (r > 0.66) aim(base);
  else if (r > 0.33) { aim(base - 0.22); aim(base); aim(base + 0.22); }
  else for (let i = -2; i <= 2; i++) aim(base + i * 0.2);
}

/* ================= 球、挡板 ================= */
function ballSpeed() {
  let s = 300 + Math.min(G.level, 12) * 14;
  if (G.mode === 'chaos') s *= 1.2;
  if (S.mods.fast) s *= 1.3;
  if (G.fx.slow > 0) s *= 0.65;
  if (G.fx.fast > 0) s *= 1.35;
  return Math.min(s, 640);
}
function releaseBall(b) {
  const p = G.paddle;
  b.stuck = false; b.stuckT = 0;
  const a = clamp((b.off / (p.w / 2)) * 0.5 + (Math.random() - 0.5) * 0.15, -0.9, 0.9);
  b.dx = Math.sin(a); b.dy = -Math.cos(a);
}
function launch() {
  if (!G) return;
  if (state === 'ready') {
    for (const b of G.balls) if (b.stuck) releaseBall(b);
    state = 'play'; sfx('launch');
  } else if (state === 'play') {
    let any = false;
    for (const b of G.balls) if (b.stuck) { releaseBall(b); any = true; }
    if (any) sfx('launch');
  }
}
function paddleBounce(b) {
  const p = G.paddle;
  const rel = clamp((b.x - p.x) / (p.w / 2), -1, 1);
  const a = clamp(rel * 1.05 + clamp(p.vx / 2500, -0.18, 0.18), -1.2, 1.2);
  b.dx = Math.sin(a); b.dy = -Math.cos(a);
  G.combo = 0;
  sfx('paddle');
  if (G.fx.sticky > 0 && !G.demo) { b.stuck = true; b.stuckT = 0; b.off = clamp(b.x - p.x, -p.w / 2 + 6, p.w / 2 - 6); }
}
function moveBallStep(b, d) {
  const fire = G.fx.fire > 0, bomb = G.fx.bomb > 0;
  b.x += b.dx * d; b.y += b.dy * d;
  if (b.x < b.r) { b.x = b.r; b.dx = Math.abs(b.dx); fixDir(b); }
  else if (b.x > W - b.r) { b.x = W - b.r; b.dx = -Math.abs(b.dx); fixDir(b); }
  if (b.y < TOP + b.r) { b.y = TOP + b.r; b.dy = Math.abs(b.dy); fixDir(b); }
  const p = G.paddle;
  if (G.shield && b.dy > 0 && b.y + b.r >= H - 8) {
    b.y = H - 8 - b.r; b.dy = -Math.abs(b.dy); G.shield = false;
    G.rings.push({ x: b.x, y: H - 8, r: 0, max: 60, t: 0, life: 0.3, col: '#7ad7ff' });
    burst(b.x, H - 8, '#7ad7ff', 12, 160); sfx('power');
  } else if (b.y > H + b.r + 4) { b.dead = true; return; }
  if (b.dy > 0 && !b.stuck && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h && b.x >= p.x - p.w / 2 - b.r * 0.5 && b.x <= p.x + p.w / 2 + b.r * 0.5) {
    b.y = p.y - b.r;
    paddleBounce(b);
    if (b.stuck) return;
  }
  if (G.boss && !G.boss.dead) {
    const R = bossRect(), res = circleRect(b, R.x, R.y, R.w, R.h);
    if (res) {
      if (!fire) { bounceOff(b, R, res); fixDir(b); }
      if (b.bossCd <= 0) { b.bossCd = 0.15; G.combo++; damageBoss(fire ? 2 : 1); }
    }
  }
  let hitOne = false;
  for (const br of G.bricks) {
    if (br.dead) continue;
    const res = circleRect(b, br.x, br.y, br.w, br.h);
    if (!res) continue;
    if (fire) { damageBrick(br, 99, 'fire'); G.combo++; continue; }
    if (hitOne) continue;
    hitOne = true;
    bounceOff(b, br, res); fixDir(b);
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    damageBrick(br, 1, 'ball');
    if (bomb && b.bombCd <= 0) { b.bombCd = 0.12; explodeAt(b.x, b.y, 60, null); }
  }
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
}
function updateBalls(dt) {
  const sp = ballSpeed();
  const tr = G.fx.big > 0 ? 11 : 7;
  const p = G.paddle;
  for (const b of G.balls) {
    b.r += (tr - b.r) * Math.min(1, 8 * dt);
    if (b.bossCd > 0) b.bossCd -= dt;
    if (b.bombCd > 0) b.bombCd -= dt;
    if (b.stuck) {
      b.stuckT += dt;
      if (G.demo || b.stuckT > 3) releaseBall(b);
      continue;
    }
    const dist = sp * dt, steps = Math.max(1, Math.ceil(dist / 4)), step = dist / steps;
    for (let i = 0; i < steps; i++) { moveBallStep(b, step); if (b.dead || b.stuck) break; }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 9) b.trail.shift();
  }
  G.balls = G.balls.filter(b => !b.dead);
  if (G.balls.length === 0) loseBall();
  void p;
}
function resetFx() { G.fx = {}; G.shield = false; }
function loseBall() {
  if (G.demo) { spawnBalls(); return; }
  G.combo = 0;
  if (G.mode === 'time') { G.timeLeft = Math.max(0, G.timeLeft - 5); addText(G.paddle.x, G.paddle.y - 30, '-5 秒', '#ff8a8a', 18); }
  else G.lives--;
  sfx('lose'); G.shake = 10;
  if (G.lives <= 0) { endGame(false, '球掉光了'); return; }
  if (G.mode === 'time' && G.timeLeft <= 0) { endGame(false, '时间到'); return; }
  resetFx(); G.pups = []; G.lasers = []; G.bullets = []; G.invuln = 1;
  spawnBalls();
  state = 'ready';
}
function hitByBullet() {
  G.lives--; G.invuln = 2; G.shake = 10; G.combo = 0;
  burst(G.paddle.x, G.paddle.y, '#ff5d73', 18, 220);
  sfx('lose');
  if (G.lives <= 0) endGame(false, '被 Boss 击中');
}
function updatePaddle(dt) {
  const p = G.paddle;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) G.target = clamp(G.target + dir * 560 * dt, 0, W);
  const goal = G.fx.reverse > 0 ? W - G.target : G.target;
  const base = S.mods.mini ? 64 : 92;
  p.tw = base * (G.fx.wide > 0 ? 1.55 : 1) * (G.fx.narrow > 0 ? 0.62 : 1);
  p.w += (p.tw - p.w) * Math.min(1, 10 * dt);
  const old = p.x;
  p.x += (goal - p.x) * Math.min(1, 28 * dt);
  p.x = clamp(p.x, p.w / 2 + 4, W - p.w / 2 - 4);
  p.vx = dt > 0 ? (p.x - old) / dt : 0;
  for (const b of G.balls) if (b.stuck) { b.x = p.x + b.off; b.y = p.y - b.r - 1; }
}

/* ================= 其余更新 ================= */
function updatePups(dt) {
  const p = G.paddle;
  for (const q of G.pups) {
    q.y += q.vy * dt; q.ph += dt * 6;
    if (G.fx.magnet > 0) q.x += clamp((p.x - q.x) * 2.4 * dt, -220 * dt, 220 * dt);
    if (q.y >= p.y - 8 && q.y <= p.y + p.h + 10 && Math.abs(q.x - p.x) <= p.w / 2 + 12) { q.dead = true; applyPowerup(q.k); }
    else if (q.y > H + 20) q.dead = true;
  }
  G.pups = G.pups.filter(q => !q.dead);
}
function updateLasers(dt) {
  const p = G.paddle;
  if (G.fx.laser > 0) {
    G.laserCd -= dt;
    if (G.laserCd <= 0) {
      G.laserCd = 0.26;
      G.lasers.push({ x: p.x - p.w / 2 + 4, y: p.y - 6 }, { x: p.x + p.w / 2 - 4, y: p.y - 6 });
      sfx('laser');
    }
  }
  for (const l of G.lasers) {
    l.y -= 720 * dt;
    if (l.y < TOP) { l.dead = true; continue; }
    const r = { x: l.x - 2, y: l.y, w: 4, h: 14 };
    for (const br of G.bricks) {
      if (br.dead || !overlap(r, br)) continue;
      l.dead = true;
      if (br.t !== 's') damageBrick(br, 1, 'laser'); else { br.flash = 0.1; }
      break;
    }
    if (l.dead) continue;
    if (G.boss && !G.boss.dead) {
      const R = bossRect();
      if (overlap(r, R)) { l.dead = true; damageBoss(0.4); continue; }
    }
    for (const bu of G.bullets) if (Math.abs(bu.x - l.x) < 8 && Math.abs(bu.y - l.y) < 12) { bu.dead = true; l.dead = true; burst(bu.x, bu.y, '#ff5d73', 6, 90); break; }
  }
  G.lasers = G.lasers.filter(l => !l.dead);
}
function updateBoss(dt) {
  const B = G.boss;
  if (!B) return;
  if (B.dead) return;
  B.t += dt;
  if (B.flash > 0) B.flash -= dt;
  B.x = W / 2 + Math.sin(B.t * (0.8 + B.k * 0.06)) * (W / 2 - B.w / 2 - 12);
  B.y = 100 + Math.sin(B.t * 1.6) * 6;
  B.shoot -= dt;
  if (B.shoot <= 0) { bossShoot(); B.shoot = 1.9 - (1 - B.hp / B.max) * 0.9; }
}
function updateBullets(dt) {
  const p = G.paddle;
  for (const bu of G.bullets) {
    bu.x += bu.vx * dt; bu.y += bu.vy * dt;
    if (bu.y > H + 10 || bu.x < -10 || bu.x > W + 10) { bu.dead = true; continue; }

    if (!(v > 0)) continue;
    ctx.fillStyle = 'rgba(8,6,28,.7)'; rr(ctx, x, H - 22, 46, 14, 7); ctx.fill();
    ctx.fillStyle = P.bad ? C.coral : P.c; rr(ctx, x + 1, H - 21, Math.max(6, 44 * (v / P.dur)), 12, 6); ctx.fill();
    ctx.fillStyle = '#14102e'; ctx.font = '700 11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(P.g + ' ' + P.n.slice(0, 2), x + 6, H - 14);
    x += 50;
  }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!bgc) makeBg();
  ctx.globalAlpha = 1;
  ctx.drawImage(bgc, 0, 0, W, H);
  if (!G) return;
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake, rnd(-1, 1) * G.shake);
  if (G.mode === 'endless' && !G.demo) {
    ctx.strokeStyle = 'rgba(255,93,115,.35)'; ctx.setLineDash([8, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, G.paddle.y - 34); ctx.lineTo(W, G.paddle.y - 34); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const br of G.bricks) if (!br.dead) drawBrick(br);
  drawBoss();
  for (const q of G.pups) drawPowerup(q);
  for (const l of G.lasers) { ctx.fillStyle = '#ffb36b'; ctx.shadowColor = '#ff9f5a'; ctx.shadowBlur = 8; ctx.fillRect(l.x - 1.5, l.y, 3, 14); ctx.shadowBlur = 0; }
  for (const bu of G.bullets) {
    ctx.save(); ctx.shadowColor = C.coral; ctx.shadowBlur = 12; ctx.fillStyle = '#ff8a9a';
    ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r, 0, 7); ctx.fill(); ctx.restore();
  }
  for (const b of G.balls) drawBall(b);
  drawPaddle();
  if (G.shield) { ctx.fillStyle = 'rgba(122,215,255,.85)'; ctx.shadowColor = '#7ad7ff'; ctx.shadowBlur = 12; ctx.fillRect(0, H - 8, W, 3); ctx.shadowBlur = 0; }
  drawWaves();
  drawFxLayer();
  ctx.restore();
  if (G.demo) return;
  drawHUD();
  if (G.mode === 'endless') {
    const full = Math.max(3.4, 9 - G.level * 0.7);
    ctx.fillStyle = 'rgba(255,93,115,.5)'; ctx.fillRect(0, TOP, W * clamp(1 - G.spawnT / full, 0, 1), 3);
  }
  if (G.boss && !G.boss.dead) {
    const B = G.boss;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(ctx, 14, TOP + 6, W - 28, 8, 4); ctx.fill();
    ctx.fillStyle = B.col; rr(ctx, 14, TOP + 6, Math.max(6, (W - 28) * clamp(B.hp / B.max, 0, 1)), 8, 4); ctx.fill();
  }
  drawPills();
  if (G.banner) {
    ctx.globalAlpha = clamp(G.banner.t * 1.5, 0, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 30px ' + FONT; ctx.fillStyle = C.text; ctx.shadowColor = C.violet; ctx.shadowBlur = 16;
    ctx.fillText(G.banner.text, W / 2, H * 0.5); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (state === 'ready') {
    ctx.globalAlpha = 0.6 + Math.sin(G.time * 5) * 0.4; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 18px ' + FONT; ctx.fillStyle = C.gold;
    ctx.fillText('点击或按空格发射', W / 2, H - 110); ctx.globalAlpha = 1;
  }
  if (G.slowing) { ctx.fillStyle = 'rgba(61,224,208,.07)'; ctx.fillRect(0, 0, W, H); }
}

/* ================= 遮罩界面 ================= */
function showOv(html) { ov.innerHTML = html; ov.hidden = false; ov.scrollTop = 0; }
function hideOv() { ov.hidden = true; }
const fmt = n => Math.round(n).toLocaleString('en-US');

function menuHTML() {
  const modes = MODES.map(m => '<button class="btn mode" type="button" data-a="start" data-v="' + m.id + '"><span class="mn">' + m.n + '</span><span class="best">' + (BEST[m.id] ? fmt(BEST[m.id]) : '—') + '</span><span class="md">' + m.d + '</span></button>').join('');
  const chips = MODS.map(m => '<button class="chip" type="button" data-a="mod" data-v="' + m.id + '" aria-pressed="' + S.mods[m.id] + '">' + m.n + '</button>').join('');
  const on = MODS.filter(m => S.mods[m.id]).map(m => m.n + '：' + m.d).join('；');
  return '<div class="box"><h1>霓虹打砖块</h1><p class="sub">15 种道具 · 9 类砖块 · 5 种模式</p>' +
    '<h2>选择模式（右侧为最高分）</h2><div class="modes">' + modes + '</div>' +
    '<h2>附加规则</h2><div class="chips">' + chips + '</div>' +
    '<p class="note">' + (on || '点选可叠加挑战') + '</p>' +
    '<button class="btn ghost" type="button" data-a="help">玩法说明</button></div>';
}
function helpHTML() {
  const pw = Object.keys(POW).map(k => { const P = POW[k]; return '<div class="it"><span class="ic' + (P.bad ? ' bad' : '') + '" style="background:' + P.c + '">' + P.g + '</span><div><b>' + P.n + '</b><span class="d">' + P.d + '</span></div></div>'; }).join('');
  const bk = BRICKINFO.map(b => '<div class="it"><span class="sw" style="background:' + b.c + '"></span><div><b>' + b.n + '</b><span class="d">' + b.d + '</span></div></div>').join('');
  return '<div class="box"><h1>玩法说明</h1>' +
    '<h2>操控</h2><ul class="keyl"><li>鼠标移动，或手指在屏幕上拖动，控制挡板；键盘用 ← → 或 A D</li><li>点击 / 空格发射球，也用来释放粘住的球</li><li>底部能量条靠打碎砖块和击伤 Boss 充能；技能键 1～4，手机点底部按钮</li><li>P 或 Esc 暂停，M 静音</li></ul>' +
    '<h2>技能（消耗能量，上限 100）</h2><div class="pg"><div class="it"><span class="ic" style="background:#3de0d0">缓</span><div><b>时缓 · 按住 Shift</b><span class="d">时间变慢，按住期间持续耗能量</span></div></div>' +
    SKILLS.map(s => '<div class="it"><span class="ic" style="background:#3de0d0">' + s.g + '</span><div><b>' + s.n + ' · ' + s.cost + ' · 键 ' + s.k + '</b><span class="d">' + s.d + '</span></div></div>').join('') + '</div>' +
    '<h2>计分</h2><ul class="keyl"><li>球不碰挡板连续打砖会累积连击，每 4 连击加 0.25 倍得分，最高 ×4</li><li>虚线圆圈的道具是坏道具，别接</li><li>Boss 会发射子弹，被击中会扣一条命；激光能击落子弹</li></ul>' +
    '<h2>砖块</h2><div class="pg">' + bk + '</div>' +
    '<h2>道具</h2><div class="pg">' + pw + '</div>' +
    '<button class="btn primary" type="button" data-a="menu">返回</button></div>';
}
function pauseHTML() {
  return '<div class="box"><p class="big">已暂停</p><div class="row"><button class="btn primary" type="button" data-a="resume">继续</button><button class="btn ghost" type="button" data-a="retry">重新开始</button><button class="btn ghost" type="button" data-a="menu">回到菜单</button></div></div>';
}
function clearHTML(bonus) {
  const t = G.mode === 'boss' ? 'Boss 击破' : '第 ' + G.level + ' 关完成';
  return '<div class="box"><p class="big">' + t + '</p><div class="stats"><div class="stat"><small>得分</small><strong>' + fmt(G.score) + '</strong></div><div class="stat"><small>过关奖励</small><strong>+' + fmt(bonus) + '</strong></div><div class="stat"><small>最高连击</small><strong>' + G.maxCombo + '</strong></div></div><button class="btn primary" type="button" data-a="next">下一关（空格）</button></div>';
}
function overHTML(win, reason, nb) {
  const prog = G.mode === 'time' ? '第 ' + G.stage + ' 波' : '第 ' + G.level + (G.mode === 'boss' ? ' 个 Boss' : ' 关');
  return '<div class="box"><p class="big' + (win ? '' : ' lose') + '">' + (win ? '通关！' : '游戏结束') + '</p><p class="sub">' + reason + '</p>' +
    (nb ? '<p class="flag">新纪录！</p>' : '') +
    '<div class="stats"><div class="stat"><small>得分</small><strong>' + fmt(G.score) + '</strong></div><div class="stat"><small>最高分</small><strong>' + fmt(BEST[G.mode] || 0) + '</strong></div><div class="stat"><small>进度</small><strong>' + prog + '</strong></div><div class="stat"><small>最高连击</small><strong>' + G.maxCombo + '</strong></div></div>' +
    '<div class="row"><button class="btn primary" type="button" data-a="retry">再来一局</button><button class="btn ghost" type="button" data-a="menu">回到菜单</button></div></div>';
}

/* ================= 流程控制 ================= */
function toMenu() {
  state = 'menu';
  G = makeGame('demo', true);
  loadLevel(1);
  showOv(menuHTML());
  updateButtons();
}
function startGame(mode) {
  S.mode = mode;
  G = makeGame(mode, false);
  loadLevel(1);
  state = 'ready';
  hideOv();
  updateButtons();
}
function nextLevel() {
  if (state !== 'clear') return;
  loadLevel(G.level + 1);
  state = 'ready';
  hideOv();
}
function togglePause() {
  if (state === 'play' || state === 'ready') { prevState = state; state = 'paused'; showOv(pauseHTML()); }
  else if (state === 'paused') { state = prevState; hideOv(); }
  updateButtons();
}
function act(a, v) {
  switch (a) {
    case 'start': startGame(v); break;
    case 'mod': S.mods[v] = !S.mods[v]; { const st = ov.scrollTop; showOv(menuHTML()); ov.scrollTop = st; } break;
    case 'help': showOv(helpHTML()); break;
    case 'menu': toMenu(); break;
    case 'next': nextLevel(); break;
    case 'resume': togglePause(); break;
    case 'retry': startGame(S.mode); break;
    default: break;
  }
}
function updateButtons() {
  pauseBtn.textContent = state === 'paused' ? '继续' : '暂停';
  sndBtn.textContent = '音效 ' + (S.sound ? '开' : '关');
}

/* ================= 输入 ================= */
ov.addEventListener('click', e => {
  ac();
  const b = e.target.closest ? e.target.closest('[data-a]') : null;
  if (b) act(b.dataset.a, b.dataset.v);
});
let ptrLast = null;
function pointerX(e) { const r = cv.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * W; }
frame.addEventListener('pointerdown', e => {
  ac();
  ptrLast = e.clientX;
  if (G && e.pointerType !== 'touch') G.target = clamp(pointerX(e), 0, W);
  if (state === 'ready' || state === 'play') launch();
});
frame.addEventListener('pointermove', e => {
  if (!G || state === 'menu' || state === 'over') return;
  if (e.pointerType === 'touch') {
    if (ptrLast == null) ptrLast = e.clientX;
    const r = cv.getBoundingClientRect();
    G.target = clamp(G.target + ((e.clientX - ptrLast) / r.width) * W * 1.25, 0, W);
    ptrLast = e.clientX;
  } else G.target = clamp(pointerX(e), 0, W);
});
frame.addEventListener('pointerup', () => { ptrLast = null; });
frame.addEventListener('pointercancel', () => { ptrLast = null; });

window.addEventListener('keydown', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') { keys.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'KeyD') { keys.right = true; e.preventDefault(); }
  else if (k === 'Space' || k === 'Enter') {
    ac(); e.preventDefault();
    if (state === 'ready' || state === 'play') launch();
    else if (state === 'clear') nextLevel();
  }
  else if (k === 'KeyP' || k === 'Escape') togglePause();
  else if (k === 'ShiftLeft' || k === 'ShiftRight' || k === 'KeyE') skillHeld = true;
  else if (k === 'KeyM') { S.sound = !S.sound; updateButtons(); }
  else if (/^(Digit|Numpad)[1-4]$/.test(k)) { const s = SKILLS[Number(k.slice(-1)) - 1]; if (s) useSkill(s.id); }
});
window.addEventListener('keyup', e => {
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = false;
  else if (k === 'ArrowRight' || k === 'KeyD') keys.right = false;
  else if (k === 'ShiftLeft' || k === 'ShiftRight' || k === 'KeyE') skillHeld = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = skillHeld = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'play' || state === 'ready')) togglePause(); });

slowBtn.addEventListener('pointerdown', e => { ac(); skillHeld = true; e.stopPropagation(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) slowBtn.addEventListener(ev, () => { skillHeld = false; });
const skillBtns = Array.from(document.querySelectorAll('[data-sk]'));
for (const sb of skillBtns) sb.addEventListener('pointerdown', e => { ac(); e.preventDefault(); useSkill(sb.dataset.sk); });
const meter = document.getElementById('meter');
pauseBtn.addEventListener('click', () => { ac(); togglePause(); });
sndBtn.addEventListener('click', () => { ac(); S.sound = !S.sound; updateButtons(); });

/* ================= 布局与主循环 ================= */
function fit() {
  const s = Math.max(0.2, Math.min(stage.clientWidth / W, stage.clientHeight / H));
  frame.style.width = Math.floor(W * s) + 'px';
  frame.style.height = Math.floor(H * s) + 'px';
  frame.style.setProperty('--s', s.toFixed(3));
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
window.addEventListener('resize', fit);

let last = 0, lastE = -1;
function loop(t) {
  const dt = Math.min(0.033, (t - last) / 1000) || 0.016;
  last = t;
  if (G && state !== 'paused') update(dt);
  if (G) {
    const e = Math.round(G.energy);
    if (e !== lastE) { lastE = e; meter.style.setProperty('--e', e + '%'); }
    const can = state === 'play' && !G.demo;
    slowBtn.classList.toggle('on', !!G.slowing);
    slowBtn.classList.toggle('ready', can && G.energy > 0 && !G.slowing);
    for (const sb of skillBtns) {
      const sk = SKILLS.find(x => x.id === sb.dataset.sk);
      sb.classList.toggle('ready', !!sk && can && G.energy >= sk.cost && G.skillCd <= 0);
    }
  }
  render();
  requestAnimationFrame(loop);
}

fit();
toMenu();
requestAnimationFrame(loop);
})();
</script>

</body></html>
